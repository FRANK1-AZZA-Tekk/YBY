name: YBY quality

on:
  push:
    branches:
      - main
      - feature/yby-intelligent-ui-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Validate installed package
        run: python -c "import yby; import yby_zero; print(yby.__name__, yby_zero.__name__)"

      - name: Validate schema and run tests
        run: python -m pytest -q --cov=yby --cov-report=term-missing --cov-report=xml --junitxml=pytest.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: yby-quality-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest.xml