name: YBY quality

on:
  push:
    branches:
      - main
      - feature/yby-intelligent-ui-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Validate schema and run tests
        run: python -m pytest -q --cov=src/yby --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: yby-coverage-python-${{ matrix.python-version }}
          path: coverage.xml