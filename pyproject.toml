[project]
name = "yby"
version = "0.1.0"
description = "YBY — plataforma open source de IA vestível, distribuída e centrada no ser humano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["yby*", "yby_zero*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["yby"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
