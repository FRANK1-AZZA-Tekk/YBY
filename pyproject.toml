[project]
name = "yby"
version = "0.1.0"
description = "YBY — plataforma open source de IA vestível, distribuída e centrada no ser humano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/yby"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
